<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Telegram Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--tg-theme-bg-color, #1a1a24); color: var(--tg-theme-text-color, #ffffff); padding: 15px; display: flex; flex-direction: column; height: 100vh; }
​.card { background: var(--tg-theme-secondary-bg-color, #242432); border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: center; }
.stars-balance { font-size: 24px; font-weight: bold; color: #ffd700; margin: 10px 0; }
​button { background: #3390ec; color: #fff; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; font-size: 15px; }
button:active { opacity: 0.8; }
button.stars-btn { background: linear-gradient(135deg, #ffaa00, #ff8800); }
​.chat-box { flex: 1; background: var(--tg-theme-secondary-bg-color, #242432); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; overflow: hidden; }
.messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 5px; }
.msg { background: #2f2f42; padding: 8px 12px; border-radius: 8px; max-width: 80%; word-break: break-word; }
.msg.my { align-self: flex-end; background: #3390ec; }
.msg.system { align-self: center; background: transparent; color: #888; font-size: 12px; }
​.input-row { display: flex; gap: 8px; margin-top: 10px; }
.input-row input { flex: 1; background: #1a1a24; border: 1px solid #3a3a4c; color: #fff; padding: 10px; border-radius: 8px; outline: none; }
.input-row button { width: auto; margin-top: 0; }
</style>
</head>
<body>
​<div class="card">
<div>Мой Баланс</div>
<div class="stars-balance">⭐ <span id="stars-count">0</span> Stars</div>
<button class="stars-btn" onclick="buyStars(50)">Купить 50 ⭐</button>
<button class="stars-btn" onclick="buyStars(100)">Купить 100 ⭐</button>
</div>
​<div class="card">
<button id="find-btn" onclick="findPartner()">🔍 Найти собеседника</button>
</div>
​<div class="chat-box">
<div class="messages" id="messages">
<div class="msg system">Нажмите «Найти собеседника», чтобы начать общение.</div>
</div>
<div class="input-row">
<input type="text" id="msg-input" placeholder="Сообщение..." disabled />
<button id="send-btn" onclick="sendMessage()" disabled>Отправить</button>
</div>
</div>
​<script>
const tg = window.Telegram?.WebApp;
if (tg) tg.ready();
​const socket = io();
let starsBalance = 0;
const userId = tg?.initDataUnsafe?.user?.id || 'guest_' + Math.floor(Math.random() * 10000);
​socket.emit('register_user', { id: userId, name: tg?.initDataUnsafe?.user?.first_name || 'Гость' });
​// Покупка звёзд через Telegram Stars API
async function buyStars(amount) {
try {
const res = await fetch('/api/create-stars-invoice', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ userId, amount, title: Пополнение ${amount} ⭐ })
});
​const data = await res.json();
if (data.success && data.invoiceLink) {
if (tg && tg.openInvoice) {
tg.openInvoice(data.invoiceLink, (status) => {
if (status === 'paid') {
starsBalance += amount;
document.getElementById('stars-count').innerText = starsBalance;
addMessage('Система', Вы успешно приобрели ${amount} ⭐!);
} else {
tg.showAlert('Оплата не была завершена.');
}
});
} else {
window.open(data.invoiceLink, '_blank');
}
} else {
alert('Ошибка создания счета: ' + (data.error || 'Проверьте BOT_TOKEN'));
}
} catch (e) {
alert('Ошибка запроса: ' + e.message);
}
}
​function findPartner() {
document.getElementById('find-btn').disabled = true;
document.getElementById('find-btn').innerText = 'Поиск...';
socket.emit('find_partner');
}
​function sendMessage() {
const input = document.getElementById('msg-input');
const text = input.value.trim();
if (!text) return;
​socket.emit('send_message', { text });
addMessage('Вы', text, true);
input.value = '';
}
​function addMessage(sender, text, isMy = false) {
const msgDiv = document.createElement('div');
msgDiv.className = msg ${isMy ? 'my' : ''};
msgDiv.innerText = isMy ? text : ${sender}: ${text};
const box = document.getElementById('messages');
box.appendChild(msgDiv);
box.scrollTop = box.scrollHeight;
}
​socket.on('waiting_for_partner', () => {
addMessage('Система', 'Ожидание свободного собеседника...');
});
​socket.on('chat_start', () => {
document.getElementById('find-btn').disabled = false;
document.getElementById('find-btn').innerText = '🔄 Сменить собеседника';
document.getElementById('msg-input').disabled = false;
document.getElementById('send-btn').disabled = false;
addMessage('Система', 'Собеседник найден! Приятного общения.');
});
​socket.on('receive_message', (data) => {
addMessage('Собеседник', data.text);
});
​socket.on('partner_disconnected', () => {
addMessage('Система', 'Собеседник отключился.');
document.getElementById('msg-input').disabled = true;
document.getElementById('send-btn').disabled = true;
document.getElementById('find-btn').innerText = '🔍 Найти собеседника';
});
</script>
</body>
</html>
