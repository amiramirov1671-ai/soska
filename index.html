<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tic-Tac-Toe PvP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1115);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #171a21);
    --text: var(--tg-theme-text-color, #f2f2f2);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --link: var(--tg-theme-link-color, #4da3ff);
    --button: var(--tg-theme-button-color, #4da3ff);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --accent-x: #4da3ff;
    --accent-o: #ff6b6b;
    --ok: #35c76a;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app { max-width: 480px; margin: 0 auto; padding: 16px; min-height: 100%; display: flex; flex-direction: column; gap: 16px; }

  .card { background: var(--secondary-bg); border-radius: 16px; padding: 16px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }

  .avatar { width: 44px; height: 44px; border-radius: 50%; background: #333 center/cover no-repeat; flex-shrink: 0; }
  .name { font-weight: 600; font-size: 16px; }
  .sub { color: var(--hint); font-size: 13px; }

  .wallet { display: flex; gap: 16px; font-size: 14px; }
  .wallet b { font-size: 16px; }

  .stakes { display: flex; gap: 8px; flex-wrap: wrap; }
  .stake-btn {
    flex: 1 1 70px;
    padding: 12px 8px;
    border-radius: 12px;
    border: 2px solid transparent;
    background: rgba(255,255,255,0.06);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .stake-btn.active { border-color: var(--button); background: rgba(77,163,255,0.15); }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--button);
    color: var(--button-text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.secondary { background: rgba(255,255,255,0.08); color: var(--text); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .status { text-align: center; color: var(--hint); font-size: 14px; min-height: 18px; }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    aspect-ratio: 1 / 1;
  }
  .cell {
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
  }
  .cell.x { color: var(--accent-x); }
  .cell.o { color: var(--accent-o); }
  .cell.disabled { cursor: default; }

  .turn-indicator { text-align: center; font-size: 15px; }
  .turn-indicator b { color: var(--button); }
  .timer-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .timer-fill { height: 100%; background: var(--button); transition: width 1s linear; }

  .players-row { display: flex; justify-content: space-between; align-items: center; }
  .player-chip { display: flex; align-items: center; gap: 8px; }
  .player-chip.dim { opacity: 0.5; }

  .hidden { display: none !important; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50;
  }
  .modal { background: var(--secondary-bg); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; text-align: center; }
  .modal h2 { margin: 0 0 8px; }
  .modal p { color: var(--hint); margin: 4px 0 16px; }

  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: #c0392b; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 14px; text-align: center;
    z-index: 60;
  }
</style>
</head>
<body>
<div id="app">

  <div class="card row between" id="profile-card">
    <div class="row">
      <div class="avatar" id="avatar"></div>
      <div>
        <div class="name" id="user-name">—</div>
        <div class="sub" id="user-stats">—</div>
      </div>
    </div>
    <div class="wallet">
      <div>💰 <b id="wallet-paid">0</b><div class="sub">баланс</div></div>
      <div>🏆 <b id="wallet-prize">0</b><div class="sub">выигрыш</div></div>
    </div>
  </div>

  <div class="card" id="lobby-card">
    <div class="sub" style="margin-bottom:8px;">Выберите ставку (Telegram Stars)</div>
    <div class="stakes" id="stakes"></div>
    <div style="height:12px"></div>
    <button class="btn" id="find-btn">Найти соперника</button>
    <button class="btn secondary hidden" id="cancel-btn">Отменить поиск</button>
    <div class="status" id="lobby-status"></div>
  </div>

  <div class="card hidden" id="game-card">
    <div class="players-row" style="margin-bottom:12px;">
      <div class="player-chip" id="player-x">
        <div class="avatar" style="width:32px;height:32px;"></div>
        <div><div class="name" id="name-x" style="font-size:14px;">X</div></div>
      </div>
      <div style="font-weight:700; color:var(--hint);">VS</div>
      <div class="player-chip" id="player-o">
        <div><div class="name" id="name-o" style="font-size:14px; text-align:right;">O</div></div>
        <div class="avatar" style="width:32px;height:32px;"></div>
      </div>
    </div>

    <div class="turn-indicator" id="turn-indicator">—</div>
    <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>

    <div style="height:12px"></div>
    <div class="board" id="board"></div>
  </div>

</div>

<div class="modal-backdrop hidden" id="result-modal">
  <div class="modal">
    <h2 id="result-title">Игра окончена</h2>
    <p id="result-sub"></p>
    <button class="btn" id="result-ok-btn">Ок</button>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const initData = tg ? tg.initData : "";

  const STAKES = [5, 10, 50, 100];
  const $ = id => document.getElementById(id);

  let state = {
    user: null,
    ws: null,
    selectedStake: STAKES[0],
    searching: false,
    room: null,      // { roomId, stake, board, turn, turnStartedAt, turnSeconds, players }
    mySymbol: null,
    timerInterval: null
  };

  function toast(message) {
    const el = $("toast");
    el.textContent = message;
    el.classList.remove("hidden");
    setTimeout(() => el.classList.add("hidden"), 3500);
  }

  function renderStakes() {
    const box = $("stakes");
    box.innerHTML = "";
    STAKES.forEach(stake => {
      const btn = document.createElement("button");
      btn.className = "stake-btn" + (stake === state.selectedStake ? " active" : "");
      btn.textContent = stake + " ⭐";
      btn.onclick = () => { state.selectedStake = stake; renderStakes(); };
      box.appendChild(btn);
    });
  }

  function renderProfile() {
    if (!state.user) return;
    $("user-name").textContent = state.user.name;
    const s = state.user.stats;
    $("user-stats").textContent = `${s.wins}П · ${s.draws}Н · ${s.losses}П`;
    $("wallet-paid").textContent = state.user.wallet.paidInStars;
    $("wallet-prize").textContent = state.user.wallet.pendingPrizeStars;
    if (state.user.photoUrl) {
      $("avatar").style.backgroundImage = `url(${state.user.photoUrl})`;
    }
  }

  function setLobbyStatus(text) { $("lobby-status").textContent = text || ""; }

  function showLobby() {
    $("lobby-card").classList.remove("hidden");
    $("game-card").classList.add("hidden");
  }

  function showGame() {
    $("lobby-card").classList.add("hidden");
    $("game-card").classList.remove("hidden");
  }

  /* ------------------------- WebSocket ------------------------- */
  function connectWs() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}`);
    state.ws = ws;

    ws.onopen = () => {
      ws.send(JSON.stringify({ type: "auth", initData }));
    };

    ws.onclose = () => {
      setLobbyStatus("Соединение потеряно, переподключение...");
      setTimeout(connectWs, 1500);
    };

    ws.onmessage = ev => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      handleWsMessage(msg);
    };
  }

  function send(type, data = {}) {
    if (state.ws && state.ws.readyState === 1) {
      state.ws.send(JSON.stringify({ type, ...data }));
    }
  }

  function handleWsMessage(msg) {
    switch (msg.type) {
      case "auth_ok":
        state.user = msg.user;
        renderProfile();
        renderStakes();
        break;

      case "auth_conflict":
        toast("Открыта другая сессия. Эта вкладка отключена.");
        break;

      case "searching":
        state.searching = true;
        showLobby();
        $("find-btn").classList.add("hidden");
        $("cancel-btn").classList.remove("hidden");
        setLobbyStatus(`Ищем соперника на ставку ${msg.stake} ⭐...`);
        break;

      case "search_cancelled":
        resetLobbyToIdle();
        break;

      case "search_expired":
        resetLobbyToIdle();
        toast("Соперник не найден. Попробуйте ещё раз.");
        break;

      case "wallet_update":
        if (state.user) { state.user.wallet = msg.wallet; renderProfile(); }
        break;

      case "payment_success":
        if (state.user) { state.user.wallet = msg.wallet; renderProfile(); }
        toast(`Баланс пополнен на ${msg.stake} ⭐`);
        break;

      case "match_found":
        state.searching = false;
        enterRoom(msg);
        break;

      case "move":
        if (state.room) {
          state.room.board = msg.board;
          renderBoard();
        }
        break;

      case "turn":
        if (state.room) {
          state.room.turn = msg.turn;
          state.room.turnStartedAt = msg.turnStartedAt;
          state.room.turnSeconds = msg.turnSeconds;
          renderTurn();
          renderBoard();
        }
        break;

      case "opponent_disconnected":
        toast(`Соперник отключился. Ждём ${msg.graceSeconds}с...`);
        break;

      case "opponent_reconnected":
        toast("Соперник вернулся в игру");
        break;

      case "game_over":
        handleGameOver(msg);
        break;

      case "error":
        toast(msg.message || "Ошибка");
        if (state.searching) resetLobbyToIdle();
        break;
    }
  }

  function resetLobbyToIdle() {
    state.searching = false;
    $("find-btn").classList.remove("hidden");
    $("cancel-btn").classList.add("hidden");
    setLobbyStatus("");
  }

  /* ---------------------------- Игра ---------------------------- */
  function enterRoom(room) {
    state.room = room;
    const me = room.players.find(p => p.id === state.user.id);
    state.mySymbol = me ? me.symbol : null;

    const px = room.players.find(p => p.symbol === "X");
    const po = room.players.find(p => p.symbol === "O");
    $("name-x").textContent = px ? (px.id === state.user.id ? "Вы" : px.name) : "X";
    $("name-o").textContent = po ? (po.id === state.user.id ? "Вы" : po.name) : "O";

    showGame();
    renderBoard();
    renderTurn();
  }

  function renderBoard() {
    const box = $("board");
    box.innerHTML = "";
    const board = state.room.board;
    const myTurn = state.room.turn === state.mySymbol && !state.room.ended;

    board.forEach((val, i) => {
      const cell = document.createElement("div");
      cell.className = "cell" + (val ? " " + val.toLowerCase() : "") + (val || !myTurn ? " disabled" : "");
      cell.textContent = val || "";
      if (!val && myTurn) {
        cell.onclick = () => send("make_move", { index: i });
      }
      box.appendChild(cell);
    });
  }

  function renderTurn() {
    const mine = state.room.turn === state.mySymbol;
    $("turn-indicator").innerHTML = mine
      ? "Ваш ход — <b>" + state.room.turn + "</b>"
      : "Ход соперника — <b>" + state.room.turn + "</b>";

    if (state.timerInterval) clearInterval(state.timerInterval);
    const totalMs = state.room.turnSeconds * 1000;
    const started = state.room.turnStartedAt;
    const fill = $("timer-fill");

    function tick() {
      const elapsed = Date.now() - started;
      const pct = Math.max(0, 1 - elapsed / totalMs);
      fill.style.width = (pct * 100) + "%";
    }
    tick();
    state.timerInterval = setInterval(tick, 250);
  }

  function handleGameOver(msg) {
    if (state.timerInterval) clearInterval(state.timerInterval);
    state.room.ended = true;
    state.room.board = msg.board;
    renderBoard();

    const mePayload = msg.players.find(p => p.id === state.user.id);
    if (mePayload) {
      state.user.stats = mePayload.stats;
      state.user.wallet = mePayload.wallet;
      renderProfile();
    }

    let title, sub;
    if (msg.result === "draw") {
      title = "Ничья";
      sub = "Ставка возвращена на баланс выигрышей.";
    } else if (msg.winner === state.user.id) {
      title = "Победа! 🎉";
      sub = msg.result === "timeout" ? "Соперник не успел походить."
          : msg.result === "disconnect" ? "Соперник отключился."
          : "Три в ряд!";
    } else {
      title = "Поражение";
      sub = msg.result === "timeout" ? "Вы не успели походить."
          : msg.result === "disconnect" ? "Вы отключились от игры."
          : "Соперник собрал три в ряд.";
    }

    $("result-title").textContent = title;
    $("result-sub").textContent = sub;
    $("result-modal").classList.remove("hidden");
  }

  $("result-ok-btn").onclick = () => {
    $("result-modal").classList.add("hidden");
    state.room = null;
    resetLobbyToIdle();
    showLobby();
  };

  /* --------------------------- Ставка --------------------------- */
  $("find-btn").onclick = async () => {
    const stake = state.selectedStake;
    if (!state.user) return;

    if (state.user.wallet.paidInStars >= stake) {
      send("find_match", { stake });
      return;
    }

    setLobbyStatus("Открываем оплату...");
    try {
      const res = await fetch("/api/invoice", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ initData, stake })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || "Не удалось создать счёт");

      if (data.sufficientBalance) {
        send("find_match", { stake });
        return;
      }

      setLobbyStatus("");
      if (tg && tg.openInvoice) {
        tg.openInvoice(data.invoiceUrl, status => {
          if (status === "paid") {
            // Баланс обновится через WS-событие payment_success от вебхука
            send("find_match", { stake });
          }
        });
      } else {
        window.open(data.invoiceUrl, "_blank");
      }
    } catch (err) {
      setLobbyStatus("");
      toast(err.message);
    }
  };

  $("cancel-btn").onclick = () => send("cancel_search");

  /* ---------------------------- Старт ---------------------------- */
  renderStakes();
  connectWs();
})();
</script>
</body>
</html>
