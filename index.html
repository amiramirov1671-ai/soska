<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Витрина Товара</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-orange: #f59e0b;
      --border-radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Галерея изображений */
    .gallery {
      position: relative;
      width: 100%;
      height: 260px;
      background-color: #e2e8f0;
      overflow: hidden;
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Контент карточки */
    .content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .category-tag {
      align-self: flex-start;
      background: #e0e7ff;
      color: var(--primary-color);
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-main);
    }

    .location {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Блок таймера */
    .timer-box {
      background: #fffbeb;
      border: 1px solid #fef3c7;
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .timer-label {
      font-size: 13px;
      color: #b45309;
      font-weight: 500;
    }

    .timer-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-orange);
    }

    /* Ставки / Цены */
    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
    }

    .price-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .price-title {
      font-size: 12px;
      color: var(--text-muted);
    }

    .price-amount {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary-color);
    }

    /* Панель ввода и кнопки */
    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .input-field {
      flex: 1;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 0 14px;
      font-size: 16px;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary-color);
    }

    .btn-submit {
      flex: 1.2;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-submit:active {
      transform: scale(0.98);
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Изображение -->
    <div class="gallery">
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80" alt="Товар">
      <div class="gallery-badge">1 / 5</div>
    </div>

    <!-- Основная информация -->
    <div class="content">
      <span class="category-tag">Электроника</span>
      
      <h1 class="title">Премиум смарт-часы Ultra Series 2 (Новые)</h1>

      <div class="location">
        📍 Ташкент, Юнусабадский р-н
      </div>

      <!-- Обратный отсчет -->
      <div class="timer-box">
        <span class="timer-label">До окончания:</span>
        <span class="timer-value" id="timer">02 дн. 14 ч. 35 мин.</span>
      </div>

      <!-- Цена и Ставки -->
      <div class="price-row">
        <div class="price-block">
          <span class="price-title">Текущая ставка</span>
          <span class="price-amount" id="current-price">$180</span>
        </div>
        <div class="price-block" style="text-align: right;">
          <span class="price-title">Шаг ставки</span>
          <span style="font-size: 16px; font-weight: 700; color: #10b981;">+$10</span>
        </div>
      </div>

      <!-- Интерактивная зона -->
      <div class="action-row">
        <input type="number" class="input-field" id="bid-input" value="190" step="10">
        <button class="btn-submit" onclick="makeBid()">Сделать ставку</button>
      </div>
    </div>
  </div>

  <script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand(); // Развернуть на весь экран
      tg.ready();
    }

    // Простая логика кнопки
    function makeBid() {
      const input = document.getElementById('bid-input');
      const priceDisplay = document.getElementById('current-price');
      const newBid = parseInt(input.value);
      const currentPrice = parseInt(priceDisplay.innerText.replace('$', ''));

      if (newBid > currentPrice) {
        priceDisplay.innerText = '$' + newBid;
        input.value = newBid + 10;

        // Отправка вибрации в Telegram (если поддерживается)
        if (tg?.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }

        alert('Ставка успешно принята!');
      } else {
        alert('Ставка должна быть выше текущей!');
      }
    }
  </script>
</body>
</html>
